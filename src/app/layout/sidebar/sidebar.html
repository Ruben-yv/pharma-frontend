<nav class="sidebar" aria-label="Módulos">
  <p class="titulo">Módulos</p>
  @for (item of menu; track item.ruta) {
    <a [routerLink]="item.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: item.ruta === '/inicio' }">
      <span aria-hidden="true">{{ item.icono }}</span> {{ item.etiqueta }}
    </a>
  }
</nav>
